  <path d="M96 30a26 26 0 0 1 0 36" fill="none" stroke="#ffb547" stroke-width="5" stroke-linecap="round"/>
  <path d="M106 20a40 40 0 0 1 0 56" fill="none" stroke="#ffb547" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <!-- phone body -->
  <rect x="24" y="8" width="64" height="112" rx="14" fill="#1d1f27" stroke="#ff7a1a" stroke-width="4"/>
  <rect x="31" y="20" width="50" height="86" rx="6" fill="#fff4e3"/>
  <rect x="48" y="12" width="16" height="3.5" rx="1.75" fill="#3a3e4c"/>
  <circle cx="56" cy="113" r="3" fill="#3a3e4c"/>
  <!-- burger on screen -->
  <g transform="translate(56 64)">
    <!-- top bun -->
    <path d="M-20 -6c0-12 9-19 20-19s20 7 20 19z" fill="#f2a43a"/>
    <path d="M-20 -6c0-12 9-19 20-19s20 7 20 19z" fill="none" stroke="#c97a1e" stroke-width="1.5"/>
    <g fill="#fff6dc">
      <ellipse cx="-8" cy="-16" rx="2" ry="1.1" transform="rotate(-20 -8 -16)"/>
      <ellipse cx="2" cy="-19" rx="2" ry="1.1"/>
      <ellipse cx="10" cy="-13" rx="2" ry="1.1" transform="rotate(25 10 -13)"/>
      <ellipse cx="-2" cy="-11" rx="2" ry="1.1" transform="rotate(10 -2 -11)"/>
    </g>
    <!-- lettuce -->
    <path d="M-22 -6q3.7 4 7.3 0t7.4 0 7.3 0 7.4 0 7.3 0 7.3 0v2h-44z" fill="#4cbf4a"/>
    <!-- cheese -->
    <path d="M-20 -2h40l-6 6-4-4-6 7-5-7-6 6-4-5-5 4z" fill="#ffd23f"/>
    <!-- patty -->
    <rect x="-21" y="1" width="42" height="9" rx="4.5" fill="#6b3a1f"/>
    <!-- bottom bun -->
    <path d="M-20 11h40v3a5 5 0 0 1-5 5h-30a5 5 0 0 1-5-5z" fill="#e8952f"/>
